server {
    listen 443 ssl;
    server_name api.payflow.example;
    ssl_certificate     /etc/ssl/payflow.crt;
    ssl_certificate_key /etc/ssl/payflow.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_ecdh_curve X25519:prime256v1;
}
server {
    listen 8443 ssl;   # legacy partner endpoint
    ssl_protocols TLSv1 TLSv1.1 TLSv1.2;
}
